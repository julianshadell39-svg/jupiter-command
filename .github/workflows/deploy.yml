name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: jupiter-command-dns-agent/package.json

      - name: Install DNS agent dependencies
        working-directory: jupiter-command-dns-agent
        run: npm ci --omit=dev

      - name: Assemble static site
        run: |
          mkdir -p _site
          # Copy CNAME so GitHub Pages keeps the custom domain
          cp CNAME _site/CNAME
          # Copy DNS agent dashboard
          cp -r jupiter-command-dns-agent/public/. _site/
          # Copy compliance docs
          cp -r jupiter-command-compliance _site/compliance
          # Copy root README
          cp README.md _site/README.md

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
