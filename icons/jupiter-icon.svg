<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0a0a1a"/>

  <!-- Outer glow ring -->
  <ellipse cx="256" cy="256" rx="200" ry="54" fill="none" stroke="#c97c2e" stroke-width="6" opacity="0.35" transform="rotate(-18 256 256)"/>

  <!-- Saturn-style rings (behind planet) -->
  <ellipse cx="256" cy="256" rx="185" ry="48" fill="none" stroke="#e8983a" stroke-width="14" opacity="0.55" transform="rotate(-18 256 256)"/>
  <ellipse cx="256" cy="256" rx="155" ry="38" fill="none" stroke="#c97c2e" stroke-width="8" opacity="0.4" transform="rotate(-18 256 256)"/>

  <!-- Planet body -->
  <circle cx="256" cy="256" r="120" fill="url(#jupiterGrad)"/>

  <!-- Atmospheric bands -->
  <clipPath id="planetClip">
    <circle cx="256" cy="256" r="120"/>
  </clipPath>
  <g clip-path="url(#planetClip)">
    <rect x="136" y="196" width="240" height="22" fill="#c07030" opacity="0.6" rx="4"/>
    <rect x="136" y="228" width="240" height="14" fill="#e8983a" opacity="0.4" rx="3"/>
    <rect x="136" y="252" width="240" height="28" fill="#a85c1e" opacity="0.55" rx="4"/>
    <rect x="136" y="290" width="240" height="16" fill="#d4883a" opacity="0.45" rx="3"/>
    <rect x="136" y="316" width="240" height="20" fill="#c07030" opacity="0.5" rx="4"/>

    <!-- Great Red Spot -->
    <ellipse cx="210" cy="266" rx="30" ry="18" fill="#c0392b" opacity="0.75"/>
    <ellipse cx="210" cy="266" rx="20" ry="11" fill="#e74c3c" opacity="0.5"/>
  </g>

  <!-- Planet highlight -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.12"/>
  <ellipse cx="220" cy="218" rx="38" ry="24" fill="white" opacity="0.07" transform="rotate(-20 220 218)"/>

  <!-- Front ring segment (over planet) -->
  <path d="M 136 256 Q 256 198 376 256" fill="none" stroke="#e8983a" stroke-width="14" opacity="0.55" stroke-linecap="round"/>
  <path d="M 151 256 Q 256 204 361 256" fill="none" stroke="#c97c2e" stroke-width="8" opacity="0.4" stroke-linecap="round"/>

  <!-- Club symbol -->
  <text x="256" y="282" font-family="serif, Georgia" font-size="72" font-weight="bold"
        fill="#00e5ff" text-anchor="middle" opacity="0.92">♣</text>

  <!-- Definitions -->
  <defs>
    <radialGradient id="jupiterGrad" cx="40%" cy="38%" r="68%">
      <stop offset="0%"   stop-color="#f0a040"/>
      <stop offset="40%"  stop-color="#c97c2e"/>
      <stop offset="75%"  stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#5a2d0c"/>
    </radialGradient>
  </defs>
</svg>
